name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Vite inlines VITE_* values at build time, so they have to be
      # present here rather than on the server.
      - name: Build
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # scp-action's source glob does not match dotfiles, which would drop
      # .htaccess (and with it the SPA rewrite rules). Tarring the whole
      # directory ourselves keeps hidden files.
      - name: Package build output
        run: tar -czf site.tar.gz -C frontend/dist .

      - name: Upload archive to Hostinger
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: site.tar.gz
          target: /tmp

      # Unpack over the web root and drop Hostinger's placeholder page.
      - name: Unpack on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p "${{ secrets.SSH_TARGET }}"
            tar -xzf /tmp/site.tar.gz -C "${{ secrets.SSH_TARGET }}"
            rm -f /tmp/site.tar.gz "${{ secrets.SSH_TARGET }}/default.php"
            ls -la "${{ secrets.SSH_TARGET }}"
