name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Vite inlines VITE_* values at build time, so they have to be
      # present here rather than on the server.
      - name: Build
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Package build output
        run: tar -czf site.tar.gz -C frontend/dist .

      # Third-party SCP/SSH actions (appleboy/scp-action, appleboy/ssh-action)
      # implement their own Go SSH/SCP client, which fails against
      # Hostinger's shared hosting. Plain OpenSSH, already preinstalled on
      # the runner, works fine against the same server, so drive it
      # directly instead.
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}
        run: |
          exec > >(tee deploy-debug.log) 2>&1
          set -x
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

          SSH_OPTS="-i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes -vvv"

          scp $SSH_OPTS site.tar.gz "$SSH_USERNAME@$SSH_HOST:/tmp/site.tar.gz" \
            || echo "SCP_FAILED_EXIT=$?"

          ssh $SSH_OPTS "$SSH_USERNAME@$SSH_HOST" "
            mkdir -p '$SSH_TARGET' &&
            tar -xzf /tmp/site.tar.gz -C '$SSH_TARGET' &&
            rm -f /tmp/site.tar.gz '$SSH_TARGET/default.php' &&
            ls -la '$SSH_TARGET'
          " || echo "SSH_FAILED_EXIT=$?"

      # Temporary: publish the raw command output to a file readable at
      # raw.githubusercontent.com, since the Actions log download API
      # requires an authenticated/admin token even on public repos.
      - name: Publish debug log
        if: always()
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          cp deploy-debug.log DEPLOY_DEBUG.log
          git add DEPLOY_DEBUG.log
          git commit -m "chore: deploy debug log [skip ci]" || echo "nothing to commit"
          git push origin HEAD:main
