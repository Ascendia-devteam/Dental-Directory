name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Vite inlines VITE_* values at build time, so they have to be
      # present here rather than on the server.
      - name: Build
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Package build output
        run: tar -czf site.tar.gz -C frontend/dist .

      # Third-party SCP/SSH actions (appleboy/scp-action, appleboy/ssh-action)
      # implement their own Go SSH/SCP client, which fails against
      # Hostinger's shared hosting (non-bash login shell). Plain OpenSSH,
      # already preinstalled on the runner, works fine against the same
      # server, so drive it directly instead.
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_OPTS="-i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes"

          scp $SSH_OPTS site.tar.gz "$SSH_USERNAME@$SSH_HOST:/tmp/site.tar.gz"

          ssh $SSH_OPTS "$SSH_USERNAME@$SSH_HOST" "
            mkdir -p '$SSH_TARGET' &&
            tar -xzf /tmp/site.tar.gz -C '$SSH_TARGET' &&
            rm -f /tmp/site.tar.gz '$SSH_TARGET/default.php' &&
            ls -la '$SSH_TARGET'
          "
